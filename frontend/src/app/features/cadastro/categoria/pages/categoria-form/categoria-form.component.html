<div class="container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
        {{ isEditMode ? 'Editar Categoria' : 'Nova Categoria' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="categoriaForm" class="categoria-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome</mat-label>
          <input
            matInput
            formControlName="nome"
            placeholder="Digite o nome da categoria">

          <mat-error *ngIf="nome?.hasError('required')">
            Nome é obrigatório
          </mat-error>

          <mat-error *ngIf="nome?.hasError('minlength')">
            Nome deve possuir pelo menos 2 caracteres
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descrição</mat-label>
          <textarea
            matInput
            rows="4"
            formControlName="descricao"
            placeholder="Descrição da categoria">
          </textarea>
        </mat-form-field>

        <div class="checkbox-container">
          <mat-checkbox formControlName="ativo">
            Categoria ativa
          </mat-checkbox>
        </div>

      </form>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <button
        mat-button
        type="button"
        (click)="onCancel()"
        [disabled]="loading">

        <mat-icon>cancel</mat-icon>
        Cancelar
      </button>

      <button
        mat-raised-button
        color="primary"
        [disabled]="loading || categoriaForm.invalid"
        (click)="onSubmit()">

        <mat-icon>
          {{ loading ? 'hourglass_empty' : 'save' }}
        </mat-icon>

        {{ loading ? 'Salvando...' : (isEditMode ? 'Atualizar' : 'Salvar') }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
