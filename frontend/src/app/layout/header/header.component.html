<mat-toolbar class="header-toolbar">

  <!-- marca -->
  <a class="brand" routerLink="/dashboard">
    <div class="brand-icon">
      <mat-icon>inventory_2</mat-icon>
    </div>
    <span class="brand-name">Krosis</span>
  </a>

  <div class="divider-v"></div>

  <!-- navegação -->
  <nav class="nav">
    <button mat-button class="nav-btn" routerLink="/dashboard" routerLinkActive="active">
      Dashboard
    </button>

    <button mat-button class="nav-btn" [matMenuTriggerFor]="prevencaoMenu" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:false}">
      Prevenção
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <button mat-button class="nav-btn" [matMenuTriggerFor]="cadastroMenu" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:false}">
      Cadastro
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <button mat-button class="nav-btn" [matMenuTriggerFor]="relatorioMenu" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:false}">
      Relatório
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <button mat-button class="nav-btn">Configuração</button>
  </nav>

  <!-- menus -->
  <mat-menu #prevencaoMenu="matMenu" class="krosis-menu">
    <button mat-menu-item routerLink="/entrada">
      <mat-icon>inventory</mat-icon> Entrada Lotes
    </button>
  </mat-menu>

  <mat-menu #cadastroMenu="matMenu" class="krosis-menu">
    <button mat-menu-item routerLink="/produtos">
      <mat-icon>category</mat-icon> Produtos
    </button>
    <button mat-menu-item routerLink="/categorias">
      <mat-icon>label</mat-icon> Categorias
    </button>
    <button mat-menu-item routerLink="/fabricantes">
      <mat-icon>factory</mat-icon> Fabricantes
    </button>
    <button mat-menu-item routerLink="/usuarios">
      <mat-icon>group</mat-icon> Usuários
    </button>
  </mat-menu>

  <mat-menu #relatorioMenu="matMenu" class="krosis-menu">
    <button mat-menu-item routerLink="/relatorio-vencimento">
      <mat-icon>event_busy</mat-icon> Vencimento
    </button>
    <button mat-menu-item routerLink="/relatorio-estoque">
      <mat-icon>bar_chart</mat-icon> Estoque
    </button>
  </mat-menu>

  <!-- spacer -->
  <span class="spacer"></span>

  <!-- usuário -->
  <div class="user-area" [matMenuTriggerFor]="usuarioMenu">
    <span class="user-badge">{{ role() }}</span>
    <span class="user-name">{{ nomeUsuario() }}</span>
    <div class="avatar">{{ iniciais() }}</div>
  </div>

  <mat-menu #usuarioMenu="matMenu" class="krosis-menu">
    <button mat-menu-item>
      <mat-icon>person</mat-icon> Perfil
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item class="sair" (click)="sair()">
      <mat-icon>logout</mat-icon> Sair
    </button>
  </mat-menu>

</mat-toolbar>
