<mat-toolbar class="header-toolbar">

  <a class="brand" routerLink="/dashboard">
    <div class="brand-icon">
      <mat-icon>inventory_2</mat-icon>
    </div>
    <span class="brand-name">Krosis</span>
  </a>

  <div class="divider-v"></div>

  <nav class="nav">
    <button mat-button class="nav-btn" routerLink="/dashboard" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:true}">
      Dashboard
    </button>

    <button mat-button class="nav-btn" [matMenuTriggerFor]="prevencaoMenu">
      Prevenção
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <button mat-button class="nav-btn" [matMenuTriggerFor]="cadastroMenu">
      Cadastro
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <button mat-button class="nav-btn" [matMenuTriggerFor]="relatorioMenu">
      Relatório
      <mat-icon class="chevron">expand_more</mat-icon>
    </button>

    <button mat-button class="nav-btn">Configuração</button>
  </nav>

  <mat-menu #prevencaoMenu="matMenu" class="krosis-menu">
    <button mat-menu-item routerLink="/entrada">
      <mat-icon>qr_code_scanner</mat-icon> Entrada de Lotes
    </button>
  </mat-menu>

  <mat-menu #cadastroMenu="matMenu" class="krosis-menu">
    <button mat-menu-item routerLink="/produtos">
      <mat-icon>category</mat-icon> Produtos
    </button>
    <button mat-menu-item routerLink="/categorias">
      <mat-icon>label</mat-icon> Categorias
    </button>
    <button mat-menu-item routerLink="/fabricantes">
      <mat-icon>factory</mat-icon> Fabricantes
    </button>
    <button mat-menu-item routerLink="/usuarios">
      <mat-icon>group</mat-icon> Usuários
    </button>
  </mat-menu>

  <mat-menu #relatorioMenu="matMenu" class="krosis-menu">
    <button mat-menu-item routerLink="/relatorios/vencimento">
      <mat-icon>event_busy</mat-icon> Vencimento
    </button>
    <button mat-menu-item routerLink="/relatorios/vencidos">
      <mat-icon>dangerous</mat-icon> Vencidos
    </button>
    <button mat-menu-item routerLink="/relatorios/movimentacoes">
      <mat-icon>swap_vert</mat-icon> Movimentações
    </button>
    <button mat-menu-item routerLink="/relatorios/estoque">
      <mat-icon>inventory</mat-icon> Estoque
    </button>
    <button mat-menu-item routerLink="/relatorios/por-categoria">
      <mat-icon>label</mat-icon> Por Categoria
    </button>
    <button mat-menu-item routerLink="/relatorios/historico-operador">
      <mat-icon>manage_accounts</mat-icon> Histórico Operador
    </button>
    <button mat-menu-item routerLink="/relatorios/sem-movimentacao">
      <mat-icon>warning_amber</mat-icon> Sem Movimentação
    </button>
  </mat-menu>

  <span class="spacer"></span>

  <div class="user-area" [matMenuTriggerFor]="usuarioMenu">
    <span class="user-badge">{{ role() }}</span>
    <span class="user-name">{{ nomeUsuario() }}</span>
    <div class="avatar">{{ iniciais() }}</div>
  </div>

  <mat-menu #usuarioMenu="matMenu" class="krosis-menu">
    <button mat-menu-item>
      <mat-icon>person</mat-icon> Perfil
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item class="sair" (click)="sair()">
      <mat-icon>logout</mat-icon> Sair
    </button>
  </mat-menu>

</mat-toolbar>
