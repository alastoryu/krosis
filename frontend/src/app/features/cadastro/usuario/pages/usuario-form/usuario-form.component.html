<div class="container">
  <mat-card class="form-card">

    <mat-card-header>
      <mat-card-title class="title">
        <mat-icon>{{ isEditMode ? 'edit' : 'person_add' }}</mat-icon>
        {{ isEditMode ? 'Editar Usuário' : 'Novo Usuário' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="usuarioForm" class="usuario-form">

        <!-- Nome -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" placeholder="Digite o nome completo">
          <mat-error *ngIf="nome?.hasError('required')">
            Nome é obrigatório
          </mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="exemplo@email.com">

          <mat-error *ngIf="email?.hasError('required')">
            Email é obrigatório
          </mat-error>

          <mat-error *ngIf="email?.hasError('email')">
            Email inválido
          </mat-error>
        </mat-form-field>

        <!-- Senha -->
        <mat-form-field appearance="outline" class="full-width" *ngIf="!isEditMode">
          <mat-label>Senha</mat-label>

          <input matInput
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="senha">

          <button mat-icon-button
                  matSuffix
                  type="button"
                  (click)="hidePassword = !hidePassword">

            <mat-icon>
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>

          <mat-error *ngIf="senha?.hasError('required')">
            Senha é obrigatória
          </mat-error>
        </mat-form-field>

        <!-- Perfil -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Perfil</mat-label>
          <mat-select formControlName="role">
            <mat-option value="USER">Usuário</mat-option>
            <mat-option value="ADMIN">Administrador</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Ativo -->
        <div class="checkbox-container">
          <mat-checkbox formControlName="ativo">
            Usuário ativo
          </mat-checkbox>
        </div>

      </form>
    </mat-card-content>

    <mat-card-actions class="card-actions">

      <button mat-button type="button" (click)="onCancel()" [disabled]="loading">
        <mat-icon>close</mat-icon>
        Cancelar
      </button>

      <button mat-raised-button
              color="primary"
              type="button"
              (click)="onSubmit()"
              [disabled]="loading || usuarioForm.invalid">

        <mat-icon>
          {{ loading ? 'hourglass_top' : 'save' }}
        </mat-icon>

        {{ loading ? 'Salvando...' : (isEditMode ? 'Atualizar' : 'Salvar') }}
      </button>

    </mat-card-actions>

  </mat-card>
</div>
